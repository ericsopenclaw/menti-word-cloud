name = "menti-word-cloud"
main = "./src/worker.js"
account_id = "e86527afe6de4dc0540cd25c9723f10c"
compatibility_date = "2026-06-05"

[[durable_objects.bindings]]
name = "WORD_CLOUD"
class_name = "WordCloudRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WordCloudRoom"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws"]

[[routes]]
pattern = "menti-word-cloud.eric020730.com"
custom_domain = true
